<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f7f5">
  <meta name="description" content="本地优先的卖家经营利润分析工具。订单、成本和费用保存在当前设备浏览器中。">
  <title>卖家利润助手 · 本地经营工作台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/xlsx.full.min.js" defer></script>
  <script type="module" src="./js/app.mjs"></script>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#overview" data-nav="overview" aria-label="卖家利润助手首页">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 44 44"><defs><linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#16a085"/></linearGradient></defs><rect width="44" height="44" rx="14" fill="url(#brand-gradient)"/><path d="M14 13h16v4H18v4h10v4H18v6h-4V13Zm16 12v6h-4v-6h4Z" fill="#fff"/></svg></span>
        <span class="brand-copy"><strong>卖家利润助手</strong><small>本地经营工作台</small></span>
      </a>
      <div class="side-section-label">工作台</div>
      <nav class="side-nav">
        <button class="nav-item active" data-nav="overview"><span class="nav-icon">◫</span><span>经营总览</span></button>
        <button class="nav-item" data-nav="stores"><span class="nav-icon">▣</span><span>店铺管理</span></button>
        <button class="nav-item" data-nav="import"><span class="nav-icon">⇧</span><span>导入数据</span></button>
        <button class="nav-item" data-nav="records"><span class="nav-icon">▤</span><span>经营记录</span></button>
        <button class="nav-item" data-nav="costs"><span class="nav-icon">◇</span><span>商品成本</span></button>
        <button class="nav-item" data-nav="issues"><span class="nav-icon">△</span><span>异常核对</span><span class="nav-count" id="nav-issue-count"></span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="privacy-card">
        <span class="privacy-icon">⌂</span>
        <strong>数据留在本机</strong>
        <p>订单与成本只保存在当前浏览器，不会上传到应用服务器或 AI。</p>
        <button class="text-button" data-nav="settings">备份与设置 <span aria-hidden="true">→</span></button>
      </div>
      <button class="nav-item nav-guide" data-nav="guide"><span class="nav-icon">?</span><span>使用指南</span></button>
      <div class="sidebar-foot"><span class="status-dot"></span><span>IndexedDB 本地保存</span></div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar-title"><span class="eyebrow" id="top-eyebrow">SELLER PROFIT WORKSPACE</span><strong id="top-title">经营总览</strong></div>
        <div class="topbar-controls">
          <label class="compact-control"><span>店铺</span><select id="global-store-select" aria-label="选择统计店铺"><option value="all">全部店铺</option></select></label>
          <label class="compact-control"><span>开始日期</span><input id="global-start" type="date" aria-label="统计开始日期"></label>
          <label class="compact-control"><span>结束日期</span><input id="global-end" type="date" aria-label="统计结束日期"></label>
          <span class="local-pill"><i></i> 当前设备</span>
        </div>
      </header>
      <main id="page-content" tabindex="-1" aria-live="polite">
        <div class="loading-state"><span class="spinner"></span><p>正在打开本地数据库…</p></div>
      </main>
      <footer class="app-footer"><span>卖家利润助手 · 本地优先版</span><span>计算规则确定 · 不调用 AI 生成金额</span></footer>
    </div>
  </div>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
