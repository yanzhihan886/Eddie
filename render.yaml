services:
  - type: web
    name: seller-profit-assistant-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: SELLER_MVP_DEMO_MODE
        value: "true"
      - key: SELLER_MVP_SECRET
        generateValue: true
      - key: SELLER_MVP_DEMO_DATA_DIR
        value: /tmp/seller-profit-assistant-demo
      - key: SELLER_MVP_DEMO_SESSION_TTL_HOURS
        value: "6"
      - key: SELLER_MVP_DEMO_MAX_SESSIONS
        value: "50"
      - key: SELLER_MVP_COOKIE_SECURE
        value: "true"
      - key: SELLER_MVP_MAX_UPLOAD_MB
        value: "5"
      - key: SELLER_MVP_MAX_ROWS
        value: "5000"
